<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaiwa Dictionary XP Pixel</title>
  <style>
    :root {
      --xp-blue: #245edb;
      --xp-blue-dark: #0b3aa7;
      --xp-blue-light: #5c8cff;
      --panel: #ece9d8;
      --panel-light: #fffdf0;
      --panel-dark: #b8b29d;
      --ink: #161616;
      --muted: #4a4a4a;
      --green: #47a447;
      --grass-dark: #2f7c36;
      --sky: #7ec4ff;
      --shadow: rgba(0, 0, 0, 0.35);
      --pixel: 3px;
      --radius: 0px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      /* 加入了现代、易读的中文字体回退链 */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "MS UI Gothic", sans-serif;
      color: var(--ink);
      image-rendering: pixelated;
      -webkit-font-smoothing: none;
      font-smooth: never;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      /* 维持上半部分的蓝天和浅绿，底部过渡更干脆 */
      background:
        linear-gradient(to bottom, #8ccfff 0 18%, #6db7f2 18% 58%, #7ab858 58% 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(255,255,255,.12) 0 2px, transparent 2px 24px),
        linear-gradient(0deg, rgba(255,255,255,.09) 0 2px, transparent 2px 24px);
      opacity: .45;
      z-index: 0;
    }

    body::after {
      content: "";
      position: fixed;
      left: 0;
      right: 0;
      bottom: 36px;
      height: 72px; /* 减小高度，只保留一层色块 */
      pointer-events: none;
      /* 统一为一个较深的绿色/棕绿色块 (Dark Olive Green) */
      background:
        linear-gradient(90deg, rgba(65,95,45,.95) 0 24px, rgba(78,110,55,.95) 24px 48px, rgba(55,85,38,.95) 48px 72px) 0 0 / 72px 72px;
      opacity: .85;
      z-index: 0;
    }

    button, input, select {
      font-family: inherit;
      font-size: 14px;
    }

    .desktop {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 28px 16px 58px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .search-shell {
      width: min(680px, calc(100vw - 28px));
      margin-top: 26vh;
      transition: margin-top .22s linear, width .22s linear;
    }

    body.searched .search-shell {
      margin-top: 18px;
      width: min(760px, calc(100vw - 28px));
    }

    .search-box {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 8px;
      background: var(--panel);
      border: var(--pixel) solid #ffffff;
      border-right-color: #7f7f7f;
      border-bottom-color: #7f7f7f;
      box-shadow: 6px 6px 0 var(--shadow);
    }

    .word-input {
      height: 46px;
      border: var(--pixel) solid #7f7f7f;
      border-top-color: #252525;
      border-left-color: #252525;
      background: #fffef3;
      padding: 0 14px;
      outline: none;
      box-shadow: inset 3px 3px 0 rgba(0,0,0,.18);
    }

    .word-input:focus {
      background: #ffffff;
    }

    .xp-button {
      min-width: 108px;
      height: 46px;
      padding: 0 14px;
      border: var(--pixel) solid #ffffff;
      border-right-color: #6f6f6f;
      border-bottom-color: #6f6f6f;
      background: linear-gradient(to bottom, #fffef4, #d8d2bc);
      cursor: pointer;
      box-shadow: 3px 3px 0 rgba(0,0,0,.24);
    }

    .xp-button:active {
      border-color: #6f6f6f;
      border-right-color: #ffffff;
      border-bottom-color: #ffffff;
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 rgba(0,0,0,.25);
    }

    .workspace {
      width: min(1060px, calc(100vw - 28px));
      margin: 24px auto 0;
      display: grid;
      grid-template-columns: minmax(0, 1.18fr) minmax(310px, .82fr);
      gap: 18px;
      align-items: start;
    }

    .hidden { display: none !important; }

    .window {
      background: var(--panel);
      border: var(--pixel) solid #083a9a;
      box-shadow: 7px 7px 0 rgba(0,0,0,.34);
      min-width: 0;
    }

    .titlebar {
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5px 0 10px;
      color: #fff;
      background: linear-gradient(to bottom, var(--xp-blue-light), var(--xp-blue) 48%, var(--xp-blue-dark));
      border-bottom: var(--pixel) solid #052a75;
      font-weight: bold;
      letter-spacing: .2px;
      text-shadow: 2px 2px 0 rgba(0,0,0,.35);
    }

    .window-title {
      display: flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tiny-icon {
      width: 15px;
      height: 15px;
      background:
        linear-gradient(90deg, #5bca54 0 7px, #8bd35c 7px 15px),
        linear-gradient(#fff, #fff);
      border: 2px solid #ebf8d5;
      box-shadow: 2px 2px 0 rgba(0,0,0,.3);
      flex: 0 0 auto;
    }

    .title-buttons {
      display: flex;
      gap: 3px;
      align-items: center;
    }

    .title-btn {
      width: 22px;
      height: 22px;
      line-height: 17px;
      padding: 0;
      border: 2px solid #ffffff;
      border-right-color: #4c4c4c;
      border-bottom-color: #4c4c4c;
      background: #e9e5d3;
      color: #123;
      font-size: 12px;
      font-weight: bold;
      cursor: default;
    }

    .window-body {
      padding: 12px;
      border-top: 2px solid rgba(255,255,255,.55);
    }

    .mini-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 8px;
      margin-bottom: 10px;
      background: #d9d4be;
      border: 2px solid #fff;
      border-right-color: #8a846f;
      border-bottom-color: #8a846f;
    }

    .mini-toolbar label {
      color: #232323;
      font-size: 13px;
    }

    .mini-toolbar select {
      height: 28px;
      border: 2px solid #7d7d7d;
      border-top-color: #252525;
      border-left-color: #252525;
      background: #fffef3;
      padding: 0 6px;
    }

    .meta-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }

    .meta-card {
      min-height: 58px;
      padding: 8px;
      background: var(--panel-light);
      border: 2px solid #ffffff;
      border-right-color: #9a927b;
      border-bottom-color: #9a927b;
      box-shadow: inset 2px 2px 0 rgba(255,255,255,.65);
    }

    .meta-label {
      color: #565040;
      font-size: 12px;
      margin-bottom: 4px;
    }

    .meta-value {
      font-size: 17px;
      font-weight: bold;
      line-height: 1.25;
      word-break: break-word;
    }

    .table-wrap {
      max-height: 464px;
      overflow: auto;
      border: 3px solid #7f7f7f;
      border-top-color: #252525;
      border-left-color: #252525;
      background: #fffef3;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 8px 7px;
      border: 2px solid #c7c0aa;
      text-align: left;
      vertical-align: top;
      line-height: 1.35;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #d9d4be;
      color: #1d1d1d;
      box-shadow: inset 0 -2px 0 #938b75;
      white-space: nowrap;
    }

    tr:nth-child(even) td { background: #f5f0d9; }
    tr:nth-child(odd) td { background: #fffef3; }

    .form-name {
      font-weight: bold;
      color: #143a8e;
      min-width: 90px;
    }

    .jp {
      font-size: 16px;
      font-weight: bold;
      color: #101010;
      word-break: keep-all;
    }

    .note {
      /* 更深的颜色，配合更清晰的字体 */
      color: #2a2a2a;
      font-size: 13px;
      margin-top: 3px;
      line-height: 1.45;
      font-weight: 500;
    }

    .dialogue-list {
      display: grid;
      gap: 10px;
    }

    .dialogue-card {
      background: #fffef3;
      border: 3px solid #7f7f7f;
      border-top-color: #ffffff;
      border-left-color: #ffffff;
      box-shadow: 3px 3px 0 rgba(0,0,0,.16);
      padding: 9px;
    }

    .dialogue-head {
      display: inline-block;
      background: #245edb;
      color: #fff;
      padding: 4px 7px;
      margin-bottom: 8px;
      font-weight: bold;
      box-shadow: 3px 3px 0 rgba(0,0,0,.22);
    }

    .line {
      padding: 7px 0;
      border-top: 2px dotted #cbc4aa;
    }

    .line:first-of-type { border-top: none; }

    .speaker {
      display: inline-block;
      min-width: 22px;
      margin-right: 4px;
      color: #143a8e;
      font-weight: bold;
    }

    .trans {
      margin: 4px 0 0 28px;
      /* 更深色、清晰的中文翻译 */
      color: #111111;
      font-size: 14px;
      line-height: 1.5;
      font-weight: 500;
    }



    .transitivity-box {
      margin-top: 10px;
      padding: 10px;
      background: #fffef3;
      border: 3px solid #7f7f7f;
      border-top-color: #ffffff;
      border-left-color: #ffffff;
      box-shadow: 3px 3px 0 rgba(0,0,0,.14);
    }

    .transitivity-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    .transitivity-card {
      padding: 8px;
      background: #f5f0d9;
      border: 2px solid #c7c0aa;
    }

    .transitivity-label {
      display: inline-block;
      margin-bottom: 6px;
      padding: 3px 6px;
      background: #245edb;
      color: #fff;
      font-weight: bold;
      box-shadow: 2px 2px 0 rgba(0,0,0,.22);
    }

    .example-line {
      margin: 4px 0;
      line-height: 1.5;
    }

    .footer-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 10px;
    }

    .small-button {
      height: 30px;
      min-width: 94px;
      padding: 0 10px;
      font-size: 12px;
      border: 2px solid #fff;
      border-right-color: #6f6f6f;
      border-bottom-color: #6f6f6f;
      background: #e9e4cf;
      box-shadow: 2px 2px 0 rgba(0,0,0,.22);
      cursor: pointer;
    }

    .small-button:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 rgba(0,0,0,.18);
    }

    .taskbar {
      position: fixed;
      z-index: 4;
      left: 0;
      right: 0;
      bottom: 0;
      height: 36px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 8px;
      background: linear-gradient(to bottom, #2f79ed, #1559d0 48%, #0e3f9e);
      border-top: 3px solid #62a2ff;
      color: #fff;
      box-shadow: 0 -3px 0 rgba(0,0,0,.18);
    }

    /* Start Button modifications */
    .start-btn {
      height: 27px;
      min-width: 74px;
      padding: 0 10px;
      color: #fff;
      font-weight: bold;
      text-shadow: 2px 2px 0 rgba(0,0,0,.3);
      border: 2px solid #91e47f;
      border-right-color: #276c20;
      border-bottom-color: #276c20;
      background: linear-gradient(to bottom, #62d75f, #2f9d2e 54%, #207b20);
      box-shadow: 2px 2px 0 rgba(0,0,0,.22);
      cursor: pointer;
    }

    .start-btn:active {
      border-top-color: #276c20;
      border-left-color: #276c20;
      border-right-color: #91e47f;
      border-bottom-color: #91e47f;
      transform: translateY(1px);
    }

    .task-status {
      max-width: 52vw;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      height: 27px;
      line-height: 24px;
      padding: 0 10px;
      border: 2px solid rgba(255,255,255,.35);
      border-right-color: rgba(0,0,0,.28);
      border-bottom-color: rgba(0,0,0,.28);
      background: rgba(10, 56, 150, .38);
      font-size: 12px;
    }

    .clock {
      margin-left: auto;
      height: 27px;
      line-height: 24px;
      min-width: 64px;
      text-align: center;
      border: 2px solid rgba(0,0,0,.25);
      border-top-color: rgba(255,255,255,.45);
      border-left-color: rgba(255,255,255,.45);
      background: rgba(6, 52, 130, .32);
      font-size: 12px;
    }

    .empty-tip {
      margin-top: 8px;
      color: rgba(0,0,0,.62);
      font-size: 13px;
      text-align: center;
      text-shadow: 1px 1px 0 rgba(255,255,255,.4);
      font-weight: bold;
    }

    body.searched .empty-tip { display: none; }

    @media (max-width: 860px) {
      .workspace { grid-template-columns: 1fr; }
      .meta-strip { grid-template-columns: 1fr; }
      .search-box { grid-template-columns: 1fr; }
      .xp-button { width: 100%; }
      .table-wrap { max-height: 420px; }
      .search-shell { margin-top: 22vh; }
    }
  </style>
</head>
<body>
  <main class="desktop">
    <section class="search-shell" aria-label="search">
      <form id="searchForm" class="search-box" autocomplete="off">
        <input id="wordInput" class="word-input" type="text" placeholder="Search Japanese verb... 例：食べる / 行く / 並ぶ・並べる / 開く・開ける" autofocus />
        <button class="xp-button" type="submit">Search</button>
      </form>
      <div class="empty-tip"></div>
    </section>

    <section id="workspace" class="workspace hidden" aria-live="polite">
      <article class="window" id="formsWindow">
        <header class="titlebar">
          <div class="window-title"><span class="tiny-icon"></span><span id="formsTitle">Conjugation.exe</span></div>
          <div class="title-buttons">
            <button class="title-btn" type="button" onclick="document.getElementById('formsWindow').classList.add('hidden')">_</button>
            <button class="title-btn" type="button">□</button>
            <button class="title-btn" type="button" onclick="document.getElementById('formsWindow').classList.add('hidden')">×</button>
          </div>
        </header>
        <div class="window-body">
          <div class="mini-toolbar">
            <label for="typeSelect">動詞タイプ</label>
            <select id="typeSelect" title="自动判断不准时可以手动切换">
              <option value="auto">Auto</option>
              <option value="godan">五段</option>
              <option value="ichidan">一段</option>
              <option value="suru">する / サ変</option>
              <option value="kuru">来る / カ変</option>
            </select>
            <button id="regenBtn" class="small-button" type="button">Regenerate</button>
            <span class="note" id="detectNote" style="margin-left: auto;">Ready.</span>
          </div>

          <div class="meta-strip">
            <div class="meta-card"><div class="meta-label">Word</div><div class="meta-value" id="metaWord">-</div></div>
            <div class="meta-card"><div class="meta-label">Meaning</div><div class="meta-value" id="metaMeaning">-</div></div>
            <div class="meta-card"><div class="meta-label">Type</div><div class="meta-value" id="metaType">-</div></div>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>活用</th>
                  <th>肯定</th>
                  <th>否定</th>
                  <th>丁寧</th>
                </tr>
              </thead>
              <tbody id="formsBody"></tbody>
            </table>
          </div>

          <section id="transitivityBox" class="transitivity-box hidden" aria-label="自動詞と他動詞ペア">
            <div class="dialogue-head" id="transitivityTitle">自他ペア</div>
            <div class="note">有固定对应词时才显示：自動詞多表示“状态自己发生”，他動詞多表示“人主动让它发生”。</div>
            <div id="transitivityExamples" class="transitivity-grid"></div>
          </section>
          <div class="footer-actions">
            <button id="copyFormsBtn" class="small-button" type="button">Copy Table</button>
          </div>
        </div>
      </article>

      <article class="window" id="dialogueWindow">
        <header class="titlebar">
          <div class="window-title"><span class="tiny-icon"></span><span id="dialogueTitle">Dialogue.txt</span></div>
          <div class="title-buttons">
            <button class="title-btn" type="button" onclick="document.getElementById('dialogueWindow').classList.add('hidden')">_</button>
            <button class="title-btn" type="button">□</button>
            <button class="title-btn" type="button" onclick="document.getElementById('dialogueWindow').classList.add('hidden')">×</button>
          </div>
        </header>
        <div class="window-body">
          <div id="dialogueList" class="dialogue-list"></div>
          <div class="footer-actions">
            <button id="copyPromptBtn" class="small-button" type="button">Copy Prompt</button>
            <button id="copyDialogueBtn" class="small-button" type="button">Copy Text</button>
          </div>
        </div>
      </article>
    </section>
  </main>

  <footer class="taskbar" aria-label="status bar">
    <button id="startBtn" class="start-btn" type="button">Start</button>
    <div id="taskStatus" class="task-status">Ready</div>
    <div id="clock" class="clock">--:--</div>
  </footer>

  <script>
    const $ = (id) => document.getElementById(id);
    const state = { rows: [], dialogues: [], forms: null, prompt: "" };

    const knownIchidan = new Set([
      "いる", "居る", "見る", "着る", "似る", "煮る", "起きる", "降りる", "借りる", "足りる", "できる",
      "食べる", "寝る", "出る", "入れる", "開ける", "閉める", "受ける", "教える", "考える", "覚える", "忘れる",
      "決める", "始める", "続ける", "止める", "見せる", "逃げる", "あげる", "くれる", "調べる", "比べる", "捨てる", "変える",
      "信じる", "感じる", "閉じる", "落ちる", "過ぎる", "浴びる"
    ]);

    const godanRuExceptions = new Set([
      "帰る", "入る", "走る", "知る", "切る", "要る", "減る", "蹴る", "滑る", "喋る", "握る", "参る", "混じる", "焦る", "限る",
      "かえる", "はいる", "はしる", "しる", "きる", "いる", "へる", "ける", "すべる", "しゃべる", "にぎる", "まいる"
    ]);

    const meaningMap = {
      "食べる": { zh: "吃", en: "eat", kana: "たべる", romaji: "taberu", pos: "一段動詞", transitivity: "他動詞", particle: "を" },
      "飲む": { zh: "喝", en: "drink", kana: "のむ", romaji: "nomu", pos: "五段動詞", transitivity: "他動詞", particle: "を" },
      "行く": { zh: "去", en: "go", kana: "いく", romaji: "iku", pos: "五段動詞", transitivity: "自動詞", particle: "へ / に" },
      "いく": { zh: "去", en: "go", kana: "いく", romaji: "iku", pos: "五段動詞", transitivity: "自動詞", particle: "へ / に" },
      "来る": { zh: "来", en: "come", kana: "くる", romaji: "kuru", pos: "カ変動詞", transitivity: "自動詞", particle: "へ / に" },
      "くる": { zh: "来", en: "come", kana: "くる", romaji: "kuru", pos: "カ変動詞", transitivity: "自動詞", particle: "へ / に" },
      "見る": { zh: "看 / 观看", en: "see / watch", kana: "みる", romaji: "miru", pos: "一段動詞", transitivity: "他動詞", particle: "を" },
      "聞く": { zh: "听 / 询问", en: "listen / ask", kana: "きく", romaji: "kiku", pos: "五段動詞", transitivity: "他動詞", particle: "を / に" },
      "読む": { zh: "读", en: "read", kana: "よむ", romaji: "yomu", pos: "五段動詞", transitivity: "他動詞", particle: "を" },
      "書く": { zh: "写", en: "write", kana: "かく", romaji: "kaku", pos: "五段動詞", transitivity: "他動詞", particle: "を" },
      "話す": { zh: "说 / 讲", en: "speak / talk", kana: "はなす", romaji: "hanasu", pos: "五段動詞", transitivity: "他動詞", particle: "を / と" },
      "買う": { zh: "买", en: "buy", kana: "かう", romaji: "kau", pos: "五段動詞", transitivity: "他動詞", particle: "を" },
      "待つ": { zh: "等待", en: "wait", kana: "まつ", romaji: "matsu", pos: "五段動詞", transitivity: "他動詞", particle: "を" },
      "作る": { zh: "做 / 制作", en: "make", kana: "つくる", romaji: "tsukuru", pos: "五段動詞", transitivity: "他動詞", particle: "を" },
      "使う": { zh: "使用", en: "use", kana: "つかう", romaji: "tsukau", pos: "五段動詞", transitivity: "他動詞", particle: "を" },
      "帰る": { zh: "回去 / 回家", en: "return / go home", kana: "かえる", romaji: "kaeru", pos: "五段動詞", transitivity: "自動詞", particle: "へ / に" },

      "集める": { zh: "收集 / 召集", en: "collect / gather", kana: "あつめる", romaji: "atsumeru", pos: "一段動詞", transitivity: "他動詞", particle: "を" },

      "始める": { zh: "开始", en: "begin / start", kana: "はじめる", romaji: "hajimeru", pos: "一段動詞", transitivity: "他動詞", particle: "を" },
      "決まる": { zh: "决定下来", en: "be decided", kana: "きまる", romaji: "kimaru", pos: "五段動詞", transitivity: "自動詞", particle: "が" },
      "決める": { zh: "决定", en: "decide", kana: "きめる", romaji: "kimeru", pos: "一段動詞", transitivity: "他動詞", particle: "を" },
      "する": { zh: "做", en: "do", kana: "する", romaji: "suru", pos: "サ変動詞", transitivity: "他動詞", particle: "を" }

    const rowMap = {
      "う": { a: "わ", i: "い", e: "え", o: "お" },
      "く": { a: "か", i: "き", e: "け", o: "こ" },
      "ぐ": { a: "が", i: "ぎ", e: "げ", o: "ご" },
      "す": { a: "さ", i: "し", e: "せ", o: "そ" },
      "つ": { a: "た", i: "ち", e: "て", o: "と" },
      "ぬ": { a: "な", i: "に", e: "ね", o: "の" },
      "ぶ": { a: "ば", i: "び", e: "べ", o: "ぼ" },
      "む": { a: "ま", i: "み", e: "め", o: "も" },
      "る": { a: "ら", i: "り", e: "れ", o: "ろ" }
    };

    const ichidanPrev = "いきぎしじちぢにひびぴみりえけげせぜてでねへべぺめれ";

    function cleanInput(value) {
      return String(value || "").trim().replace(/\s+/g, "");
    }

    function esc(value) {
      return String(value ?? "").replace(/[&<>'"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[ch]));
    }

    function rootOf(verb) {
      return verb.slice(0, -1);
    }

    function stripNai(naiForm) {
      return naiForm.replace(/ない$/, "");
    }

    function toNakute(naiForm) {
      return naiForm.replace(/ない$/, "なくて");
    }

    function toNakatta(naiForm) {
      return naiForm.replace(/ない$/, "なかった");
    }

    function toNakereba(naiForm) {
      return naiForm.replace(/ない$/, "なければ");
    }

    function toNakutemo(naiForm) {
      return naiForm.replace(/ない$/, "なくても");
    }

    function detectType(verb, selected = "auto") {
      if (selected !== "auto") return selected;
      if (verb === "来る" || verb === "くる") return "kuru";
      if (verb === "する" || verb.endsWith("する")) return "suru";
      if (knownIchidan.has(verb)) return "ichidan";
      if (godanRuExceptions.has(verb)) return "godan";
      if (verb.endsWith("る") && verb.length > 1) {
        const prev = verb.charAt(verb.length - 2);
        if (ichidanPrev.includes(prev)) return "ichidan";
      }
      return "godan";
    }

    function typeLabel(type) {
      return { godan: "五段動詞", ichidan: "一段動詞", suru: "サ変 / する", kuru: "カ変 / 来る" }[type] || "Auto";
    }

    function getMeaning(verb, type) {
      if (meaningMap[verb]) return meaningMap[verb];
      if (type === "suru" && verb.endsWith("する")) {
        const noun = verb.slice(0, -2);
        return { zh: noun ? `${noun} / 做这个动作` : "做", en: noun ? `${noun} / do this action` : "do", kana: verb, romaji: "", pos: "サ変動詞", transitivity: "多くは他動詞", particle: "を" };
      }
      return { zh: "这个动作", en: "this action", kana: verb, romaji: "", pos: typeLabel(type), transitivity: "未判定", particle: "文脈による" };
    }

    function appendShared(f) {
      f.nakatta = toNakatta(f.nai);
      f.negTe = `${toNakute(f.nai)} / ${f.nai}で`;
      f.progressive = `${f.te}いる`;
      f.progressiveNeg = `${f.te}いない`;
      f.progressivePolite = `${f.te}います`;
      f.progressivePoliteNeg = `${f.te}いません`;
      f.tai = `${f.stem}たい`;
      f.taiNeg = `${f.stem}たくない`;
      f.taiPolite = `${f.stem}たいです`;
      f.taiPoliteNeg = `${f.stem}たくありません`;
      f.masupast = `${f.stem}ました`;
      f.masupastNeg = `${f.stem}ませんでした`;
      f.tara = `${f.ta}ら`;
      f.taraNeg = `${f.nakatta}ら`;
      f.baNeg = `${toNakereba(f.nai)}`;
      f.must = `${toNakereba(f.nai)}ならない`;
      f.mustPolite = `${toNakereba(f.nai)}なりません`;
      f.noNeed = `${toNakutemo(f.nai)}いい`;
      f.noNeedPolite = `${toNakutemo(f.nai)}いいです`;
      f.request = `${f.te}ください`;
      f.requestNeg = `${f.nai}でください`;
      f.permission = `${f.te}もいい`;
      f.prohibitionPolite = `${f.nai}でください`;
      f.try = `${f.te}みる`;
      f.tryNeg = `${f.te}みない`;
      f.tooMuch = `${f.stem}すぎる`;
      f.tooMuchNeg = `${f.stem}すぎない`;
      f.easy = `${f.stem}やすい`;
      f.hard = `${f.stem}にくい`;
      f.before = `${f.dict}前に`;
      f.after = `${f.ta}後で`;
      f.without = `${f.nai}で`;
      f.probably = `${f.dict}でしょう`;
      f.probablyNeg = `${f.nai}でしょう`;
      return f;
    }

    function buildGodan(verb) {
      const last = verb.slice(-1);
      const root = rootOf(verb);
      if (!rowMap[last]) throw new Error("五段動詞として判定できません。動詞タイプを確認してください。");
      const row = rowMap[last];
      const a = root + row.a;
      const i = root + row.i;
      const e = root + row.e;
      const o = root + row.o;
      let te = "";
      let ta = "";
      if (last === "う" || last === "つ" || last === "る") { te = root + "って"; ta = root + "った"; }
      if (last === "く") { te = root + "いて"; ta = root + "いた"; }
      if (last === "ぐ") { te = root + "いで"; ta = root + "いだ"; }
      if (last === "す") { te = root + "して"; ta = root + "した"; }
      if (last === "ぬ" || last === "ぶ" || last === "む") { te = root + "んで"; ta = root + "んだ"; }
      if (verb.endsWith("行く") || verb.endsWith("いく")) { te = root + "って"; ta = root + "った"; }
      return appendShared({
        dict: verb,
        type: "godan",
        stem: i,
        masu: `${i}ます`,
        masuNeg: `${i}ません`,
        nai: `${a}ない`,
        ta,
        te,
        volitional: `${o}う`,
        volitionalNeg: `${a}ないでおこう`,
        volitionalPolite: `${i}ましょう`,
        potential: `${e}る`,
        potentialNeg: `${e}ない`,
        potentialPolite: `${e}ます`,
        potentialPoliteNeg: `${e}ません`,
        passive: `${a}れる`,
        passiveNeg: `${a}れない`,
        passivePolite: `${a}れます`,
        passivePoliteNeg: `${a}れません`,
        causative: `${a}せる`,
        causativeNeg: `${a}せない`,
        causativePolite: `${a}せます`,
        causativePoliteNeg: `${a}せません`,
        cpassive: `${a}せられる`,
        cpassiveNeg: `${a}せられない`,
        cpassivePolite: `${a}せられます`,
        cpassivePoliteNeg: `${a}せられません`,
        ba: `${e}ば`,
        imperative: e,
        prohibition: `${verb}な`
      });
    }

    function buildIchidan(verb) {
      const base = rootOf(verb);
      return appendShared({
        dict: verb,
        type: "ichidan",
        stem: base,
        masu: `${base}ます`,
        masuNeg: `${base}ません`,
        nai: `${base}ない`,
        ta: `${base}た`,
        te: `${base}て`,
        volitional: `${base}よう`,
        volitionalNeg: `${base}ないでおこう`,
        volitionalPolite: `${base}ましょう`,
        potential: `${base}られる`,
        potentialNeg: `${base}られない`,
        potentialPolite: `${base}られます`,
        potentialPoliteNeg: `${base}られません`,
        passive: `${base}られる`,
        passiveNeg: `${base}られない`,
        passivePolite: `${base}られます`,
        passivePoliteNeg: `${base}られません`,
        causative: `${base}させる`,
        causativeNeg: `${base}させない`,
        causativePolite: `${base}させます`,
        causativePoliteNeg: `${base}させません`,
        cpassive: `${base}させられる`,
        cpassiveNeg: `${base}させられない`,
        cpassivePolite: `${base}させられます`,
        cpassivePoliteNeg: `${base}させられません`,
        ba: `${base}れば`,
        imperative: `${base}ろ`,
        prohibition: `${verb}な`
      });
    }

    function buildSuru(verb) {
      const prefix = verb === "する" ? "" : verb.replace(/する$/, "");
      const stem = `${prefix}し`;
      const dict = `${prefix}する`;
      const potential = prefix ? `${prefix}できる` : "できる";
      return appendShared({
        dict,
        type: "suru",
        stem,
        masu: `${prefix}します`,
        masuNeg: `${prefix}しません`,
        nai: `${prefix}しない`,
        ta: `${prefix}した`,
        te: `${prefix}して`,
        volitional: `${prefix}しよう`,
        volitionalNeg: `${prefix}しないでおこう`,
        volitionalPolite: `${prefix}しましょう`,
        potential,
        potentialNeg: `${potential.replace(/る$/, "")}ない`,
        potentialPolite: `${potential.replace(/る$/, "")}ます`,
        potentialPoliteNeg: `${potential.replace(/る$/, "")}ません`,
        passive: `${prefix}される`,
        passiveNeg: `${prefix}されない`,
        passivePolite: `${prefix}されます`,
        passivePoliteNeg: `${prefix}されません`,
        causative: `${prefix}させる`,
        causativeNeg: `${prefix}させない`,
        causativePolite: `${prefix}させます`,
        causativePoliteNeg: `${prefix}させません`,
        cpassive: `${prefix}させられる`,
        cpassiveNeg: `${prefix}させられない`,
        cpassivePolite: `${prefix}させられます`,
        cpassivePoliteNeg: `${prefix}させられません`,
        ba: `${prefix}すれば`,
        imperative: prefix ? `${prefix}しろ` : "しろ / せよ",
        prohibition: `${dict}な`
      });
    }

    function buildKuru(verb) {
      const kana = verb === "くる";
      return appendShared({
        dict: kana ? "くる" : "来る",
        type: "kuru",
        stem: kana ? "き" : "来",
        masu: kana ? "きます" : "来ます",
        masuNeg: kana ? "きません" : "来ません",
        nai: kana ? "こない" : "来ない",
        ta: kana ? "きた" : "来た",
        te: kana ? "きて" : "来て",
        volitional: kana ? "こよう" : "来よう",
        volitionalNeg: kana ? "こないでおこう" : "来ないでおこう",
        volitionalPolite: kana ? "きましょう" : "来ましょう",
        potential: kana ? "こられる" : "来られる",
        potentialNeg: kana ? "こられない" : "来られない",
        potentialPolite: kana ? "こられます" : "来られます",
        potentialPoliteNeg: kana ? "こられません" : "来られません",
        passive: kana ? "こられる" : "来られる",
        passiveNeg: kana ? "こられない" : "来られない",
        passivePolite: kana ? "こられます" : "来られます",
        passivePoliteNeg: kana ? "こられません" : "来られません",
        causative: kana ? "こさせる" : "来させる",
        causativeNeg: kana ? "こさせない" : "来させない",
        causativePolite: kana ? "こさせます" : "来させます",
        causativePoliteNeg: kana ? "こさせません" : "来させません",
        cpassive: kana ? "こさせられる" : "来させられる",
        cpassiveNeg: kana ? "こさせられない" : "来させられない",
        cpassivePolite: kana ? "こさせられます" : "来させられます",
        cpassivePoliteNeg: kana ? "こさせられません" : "来させられません",
        ba: kana ? "くれば" : "来れば",
        imperative: kana ? "こい" : "来い",
        prohibition: kana ? "くるな" : "来るな"
      });
    }

    function buildForms(verb, selectedType) {
      const type = detectType(verb, selectedType);
      if (type === "suru") return buildSuru(verb.endsWith("する") ? verb : "する");
      if (type === "kuru") return buildKuru(verb === "くる" ? "くる" : "来る");
      if (type === "ichidan") return buildIchidan(verb);
      return buildGodan(verb);
    }

    function buildRows(f) {
      return [
        { name: "辞書形 / 非過去", aff: f.dict, neg: f.nai, polite: `${f.masu} / ${f.masuNeg}`, note: "现在・未来。日语动词没有英语式现在/未来形区分。" },
        { name: "過去形", aff: f.ta, neg: f.nakatta, polite: `${f.masupast} / ${f.masupastNeg}`, note: "过去发生或已经完成。" },
        { name: "て形", aff: f.te, neg: f.negTe, polite: `${f.request} / ${f.requestNeg}`, note: "连接动作、请求、许可、进行态的基础。" },
        { name: "進行・状態", aff: f.progressive, neg: f.progressiveNeg, polite: `${f.progressivePolite} / ${f.progressivePoliteNeg}`, note: "正在做，或动作结果持续。" },
        { name: "願望", aff: f.tai, neg: f.taiNeg, polite: `${f.taiPolite} / ${f.taiPoliteNeg}`, note: "想做 / 不想做。" },

        { name: "可能", aff: f.potential, neg: f.potentialNeg, polite: `${f.potentialPolite} / ${f.potentialPoliteNeg}`, note: "能做 / 不能做。" },
        { name: "受身", aff: f.passive, neg: f.passiveNeg, polite: `${f.passivePolite} / ${f.passivePoliteNeg}`, note: "被动。部分动词语义上不一定自然。" },
        { name: "使役", aff: f.causative, neg: f.causativeNeg, polite: `${f.causativePolite} / ${f.causativePoliteNeg}`, note: "让某人做。" },
        { name: "使役受身", aff: f.cpassive, neg: f.cpassiveNeg, polite: `${f.cpassivePolite} / ${f.cpassivePoliteNeg}`, note: "被迫做。五段口语中有时会缩短。" },
        { name: "条件ば", aff: f.ba, neg: f.baNeg, polite: `${f.ba}いいです / ${f.baNeg}だめです`, note: "如果做 / 如果不做。" },
        { name: "条件たら", aff: f.tara, neg: f.taraNeg, polite: `${f.tara}どうですか`, note: "做了的话 / 没做的话。" },
        { name: "命令・禁止", aff: f.imperative, neg: f.prohibition, polite: `${f.request} / ${f.prohibitionPolite}`, note: "命令语气较强；日常更常用ください。" },
        { name: "許可", aff: f.permission, neg: f.noNeed, polite: `${f.permission}です / ${f.noNeedPolite}`, note: "可以做 / 不做也可以。" },
        { name: "義務", aff: f.must, neg: f.noNeed, polite: `${f.mustPolite} / ${f.noNeedPolite}`, note: "必须做 / 不必做。" },

    };

    function buildTransitivityExamples(f) {
      return transitivePairs[f.dict] || null;
    }

    function renderTransitivityExamples(data) {
      const box = $("transitivityBox");
      if (!data) {
        box.classList.add("hidden");
        $("transitivityExamples").innerHTML = "";
        return;
      }
      box.classList.remove("hidden");
      $("transitivityTitle").textContent = `自他ペア：${data.pairTitle}`;
      $("transitivityExamples").innerHTML = `
        <div class="transitivity-card">
          <div class="transitivity-label">自動詞</div>
          <div class="example-line jp">${esc(data.intransitive)}</div>
          <div class="trans">中：${esc(data.inZh)}</div>
          <div class="trans">EN: ${esc(data.inEn)}</div>
        </div>
        <div class="transitivity-card">
          <div class="transitivity-label">他動詞</div>
          <div class="example-line jp">${esc(data.transitive)}</div>
          <div class="trans">中：${esc(data.trZh)}</div>
          <div class="trans">EN: ${esc(data.trEn)}</div>
        </div>
      `;
    }

    function renderForms(f, meaning, type, selectedType) {
      const rows = buildRows(f);
      state.rows = rows;
      $("formsTitle").textContent = `${f.dict} - Conjugation.exe`;
      $("metaWord").textContent = f.dict;
      $("metaMeaning").textContent = `${meaning.zh} / ${meaning.en}${meaning.kana ? `｜${meaning.kana}` : ""}`;
      $("metaType").textContent = `${typeLabel(type)}${meaning.transitivity ? `｜${meaning.transitivity}` : ""}`;
      $("detectNote").textContent = selectedType === "auto" ? `Auto detected: ${typeLabel(type)}` : `Manual mode: ${typeLabel(type)}`;
      renderTransitivityExamples(buildTransitivityExamples(f));
      $("formsBody").innerHTML = rows.map((row) => `
        <tr>
          <td><div class="form-name">${esc(row.name)}</div><div class="note">${esc(row.note)}</div></td>
          <td><span class="jp">${esc(row.aff)}</span></td>
          <td><span class="jp">${esc(row.neg)}</span></td>
          <td><span class="jp">${esc(row.polite)}</span></td>
        </tr>
      `).join("");
    }

    function renderDialogues(dialogues, f) {
      state.dialogues = dialogues;
      $("dialogueTitle").textContent = `${f.dict} - Dialogue.txt`;
      $("dialogueList").innerHTML = dialogues.map((card) => `
        <section class="dialogue-card">
          <div class="dialogue-head">${esc(card.title)}</div>
          ${card.lines.map((line) => `
            <div class="line">
              <div><span class="speaker">${esc(line.sp)}:</span><span class="jp">${esc(line.jp)}</span></div>
              <div class="trans">中：${esc(line.zh)}</div>
              <div class="trans">EN: ${esc(line.en)}</div>
            </div>
          `).join("")}
        </section>
      `).join("");
    }

    function formsToMarkdown(f, meaning, rows) {
      const lines = [];
      lines.push(`# ${f.dict}`);
      lines.push(`意味: ${meaning.zh} / ${meaning.en}`);
      if (meaning.kana || meaning.transitivity) lines.push(`読み・分類: ${meaning.kana || "-"} / ${meaning.transitivity || "-"}`);
      lines.push("");
      lines.push("| 活用 | 肯定 | 否定 | 丁寧 |");
      lines.push("|---|---|---|---|");
      rows.forEach((r) => lines.push(`| ${r.name} | ${r.aff} | ${r.neg} | ${r.polite} |`));
      return lines.join("\n");
    }

    function dialoguesToText(dialogues) {
      return dialogues.map((card) => {
        const body = card.lines.map((l) => `${l.sp}: ${l.jp}\n中: ${l.zh}\nEN: ${l.en}`).join("\n");
        return `[${card.title}]\n${body}`;
      }).join("\n\n");
    }

    function setStatus(text) {
      $("taskStatus").textContent = text;
    }

    function generate() {
      const verb = cleanInput($("wordInput").value);
      if (!verb) {
        setStatus("Please input a verb");
        $("wordInput").focus();
        return;
      }

      const selectedType = $("typeSelect").value;
      try {
        const detected = detectType(verb, selectedType);
        const forms = buildForms(verb, selectedType);
        const meaning = getMeaning(forms.dict, detected);
        const dialogues = buildDialogues(forms, meaning);
        const prompt = buildPrompt(forms, meaning);
        state.forms = forms;
        state.meaning = meaning;
        state.prompt = prompt;
        renderForms(forms, meaning, detected, selectedType);
        renderDialogues(dialogues, forms);
        document.body.classList.add("searched");
        $("workspace").classList.remove("hidden");
        // Ensure windows are visible if previously closed
        $("formsWindow").classList.remove("hidden");
        $("dialogueWindow").classList.remove("hidden");
        setStatus(`${forms.dict} opened`);
      } catch (error) {
        setStatus(error.message || "Could not generate forms");
        alert(error.message || "Could not generate forms");
      }
    }

    async function copyText(text, okMessage) {
      try {
        await navigator.clipboard.writeText(text);
        setStatus(okMessage);
      } catch (error) {
        const box = document.createElement("textarea");
        box.value = text;
        document.body.appendChild(box);
        box.select();
        document.execCommand("copy");
        box.remove();
        setStatus(okMessage);
      }
    }

    function initClock() {
      const update = () => {
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, "0");
        const mm = String(now.getMinutes()).padStart(2, "0");
        $("clock").textContent = `${hh}:${mm}`;
      };
      update();
      setInterval(update, 1000 * 20);
    }

    // 回到主页的功能 (Start Button)
    $("startBtn").addEventListener("click", () => {
      document.body.classList.remove("searched");
      $("workspace").classList.add("hidden");
      $("wordInput").value = "";
      $("wordInput").focus();
      setStatus("Ready");
    });

    $("searchForm").addEventListener("submit", (event) => {
      event.preventDefault();
      generate();
    });

    $("regenBtn").addEventListener("click", generate);
    $("typeSelect").addEventListener("change", () => {
      if ($("wordInput").value.trim()) generate();
    });

    $("copyFormsBtn").addEventListener("click", () => {
      if (!state.forms) return;
      copyText(formsToMarkdown(state.forms, state.meaning, state.rows), "Conjugation table copied");
    });

    $("copyDialogueBtn").addEventListener("click", () => {
      if (!state.dialogues.length) return;
      copyText(dialoguesToText(state.dialogues), "Dialogue copied");
    });

    $("copyPromptBtn").addEventListener("click", () => {
      if (!state.prompt) return;
      copyText(state.prompt, "AI prompt copied");
    });

    initClock();
  </script>
</body>
